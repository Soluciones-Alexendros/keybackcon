[package]
name = "ilutex"
version = "3.0.0"
edition = "2021"
rust-version = "1.87"
description = "iLutex — control cromático del teclado AERO X16 vía HID LampArray, sin dependencias"
license = "MIT"
repository = "https://github.com/Soluciones-Alexendros/ilutex"
homepage = "https://github.com/Soluciones-Alexendros/ilutex"
keywords = ["keyboard", "rgb", "hid", "lamparray", "backlight", "lutex"]
categories = ["hardware-support", "command-line-utilities"]

[[bin]]
name = "ilutex"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

[package.metadata.deb]
name = "ilutex"
maintainer = "Alexendros <operaciones@alexendros.dev>"
copyright = "2026, Alexendros"
license-file = ["LICENSE", "4"]
revision = "1"
depends = "$auto"
recommends = "python3, python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1, python3-cairo, gir1.2-ayatanaappindicator3-0.1"
section = "utils"
priority = "optional"
maintainer-scripts = "packaging/debian"
assets = [
    ["target/release/ilutex", "usr/bin/ilutex", "755"],
    ["packaging/ilutex-gui", "usr/bin/ilutex-gui", "755"],
    ["gui/*.py", "usr/share/ilutex/gui/", "644"],
    ["packaging/desktop/ilutex.desktop", "usr/share/applications/ilutex.desktop", "644"],
    ["assets/icons/ilutex.svg", "usr/share/icons/hicolor/scalable/apps/ilutex.svg", "644"],
    ["packaging/udev/70-ilutex.rules", "usr/lib/udev/rules.d/70-ilutex.rules", "644"],
    ["packaging/tmpfiles.d/ilutex.conf", "usr/lib/tmpfiles.d/ilutex.conf", "644"],
    ["packaging/sysusers.d/ilutex.conf", "usr/lib/sysusers.d/ilutex.conf", "644"],
    ["packaging/systemd/*.service", "usr/lib/systemd/user/", "644"],
    ["gui/locale/es/LC_MESSAGES/ilutex.mo", "usr/share/locale/es/LC_MESSAGES/ilutex.mo", "644"],
    ["gui/locale/en/LC_MESSAGES/ilutex.mo", "usr/share/locale/en/LC_MESSAGES/ilutex.mo", "644"],
    ["gui/org.alexendros.ilutex.gschema.xml", "usr/share/glib-2.0/schemas/org.alexendros.ilutex.gschema.xml", "644"],
]
