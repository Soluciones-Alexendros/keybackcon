name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  # Versionado lo dispara tras crear la rama de release: ese push usa
  # GITHUB_TOKEN y no encola workflows. Los checks de este SHA son los
  # que main exige para el auto-merge.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - name: Lockfile alineado
        run: |
          set -euo pipefail
          VER_TOML=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          VER_LOCK=$(awk '/name = "keybackcon"/{getline; print; exit}' Cargo.lock | sed -E 's/.*"([^"]+)".*/\1/')
          test "$VER_TOML" = "$VER_LOCK"
      - name: GUI py_compile
        run: python3 -m py_compile gui/*.py
      - name: Catálogos i18n
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext
          python3 scripts/check-i18n.py --extract
          for po in po/*.po; do
            lang=$(basename "$po" .po)
            mkdir -p "gui/locale/$lang/LC_MESSAGES"
            msgfmt -c -o "gui/locale/$lang/LC_MESSAGES/keybackcon.mo" "$po"
          done
      - name: GUI tests
        env:
          KEYBACKCON_REQUIRE_DBUS: "1"
          KEYBACKCON_GUI_TESTS: "1"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-gi \
            gir1.2-glib-2.0 \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            dbus \
            xvfb
          python3 -c "from gi.repository import Gio, GLib; print('GLib', GLib.MAJOR_VERSION, GLib.MINOR_VERSION)"
          python3 -c "import gi; gi.require_version('Gtk', '4.0'); gi.require_version('Adw', '1'); from gi.repository import Gtk, Adw; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version(), 'Adw OK')"
          # Display virtual: sin xvfb Adw.Application no arranca y la suite
          # KEYBACKCON_GUI_TESTS quedaría omitida o en rojo opaco.
          GDK_BACKEND=x11 xvfb-run -a python3 -m unittest discover -s gui/tests -v
      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/install.sh scripts/smoke.sh packaging/keybackcon-gui \
            packaging/debian/postinst packaging/debian/prerm packaging/aur/PKGBUILD
      - name: desktop-file-validate
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq desktop-file-utils
          desktop-file-validate packaging/desktop/keybackcon.desktop

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -- --test-threads=1

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87
      - run: cargo test --locked -- --test-threads=1

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release
      - name: Árbol sin cambios tras build --locked
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: keybackcon-linux
          path: target/release/keybackcon
          if-no-files-found: error

  smoke:
    name: smoke
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: keybackcon-linux
          path: target/release
      - run: chmod +x target/release/keybackcon
      - run: bash scripts/smoke.sh
      - name: Ayuda sale 0
        run: target/release/keybackcon --help >/dev/null
