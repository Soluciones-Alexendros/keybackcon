name: NPM
# Publica en npm el meta-paquete `ilutex` y los paquetes de binario por
# plataforma (ilutex-linux-x64, ilutex-linux-arm64), todos con la
# versión del tag. Requiere el secret NPM_TOKEN de la organización.
on:
  push:
    tags:
      - "v*"
  # Versionado lo dispara con workflow_dispatch tras crear el tag (un push
  # con GITHUB_TOKEN no encadenaría workflows) y permite reintentos a mano.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: |
          mkdir -p npm/platforms/linux-x64/bin
          cp target/release/ilutex npm/platforms/linux-x64/bin/ilutex
          chmod +x npm/platforms/linux-x64/bin/ilutex
      - uses: actions/upload-artifact@v4
        with:
          name: ilutex-linux-x64
          path: npm/platforms/linux-x64/bin/ilutex

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: |
          mkdir -p npm/platforms/linux-arm64/bin
          cp target/release/ilutex npm/platforms/linux-arm64/bin/ilutex
          chmod +x npm/platforms/linux-arm64/bin/ilutex
      - uses: actions/upload-artifact@v4
        with:
          name: ilutex-linux-arm64
          path: npm/platforms/linux-arm64/bin/ilutex

  publish:
    needs: [build-x64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ilutex-linux-x64
          path: npm/platforms/linux-x64/bin
      - uses: actions/download-artifact@v4
        with:
          name: ilutex-linux-arm64
          path: npm/platforms/linux-arm64/bin
      - run: chmod +x npm/platforms/linux-*/bin/ilutex
      - name: Sincronizar versiones con el tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          export VER
          node -e '
            const fs = require("fs");
            for (const p of ["npm/package.json", "npm/platforms/linux-x64/package.json", "npm/platforms/linux-arm64/package.json"]) {
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = process.env.VER;
              if (j.optionalDependencies) {
                for (const k of Object.keys(j.optionalDependencies)) j.optionalDependencies[k] = process.env.VER;
              }
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            }
          '
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publicar paquetes de plataforma
        run: |
          npm publish ./npm/platforms/linux-x64
          npm publish ./npm/platforms/linux-arm64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publicar meta-paquete
        run: npm publish ./npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
