name: Versionado
# Autoversionado: en cada push a main, git-cliff calcula el bump; si hay bump,
# sincroniza fuentes de versión, abre un PR de release en auto-merge.
# El tag vX.Y.Z se crea SOLO tras fusionar el PR (H-34), sobre el commit
# aprobado en main — nunca en la rama del PR antes del merge.
#
# Requiere el secret RELEASE_PAT (PAT con scopes `repo` y `workflow`): el
# GITHUB_TOKEN no dispara workflows (recursión) y el PR de release se queda
# sin los checks requeridos por main. El PAT encadena CI en la rama del PR y,
# al empujar el tag, Release y NPM por `on: push: tags: v*`.
# Sin RELEASE_PAT el job termina en verde con un notice y no publica
# (checkout con token vacío fallaría; no se usa GITHUB_TOKEN como fallback).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
    steps:
      - name: Sin RELEASE_PAT — no-op
        if: ${{ env.RELEASE_PAT == '' }}
        run: |
          echo "::notice::Falta el secret RELEASE_PAT. Crea un PAT (scopes repo y workflow) y guárdalo como secreto de repositorio RELEASE_PAT; sin él no hay PR de release ni tag. El job termina en verde."

      - uses: actions/checkout@v4
        if: ${{ env.RELEASE_PAT != '' }}
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Versión actual (Cargo.toml)
        if: ${{ env.RELEASE_PAT != '' }}
        id: current
        run: echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*\"([^\"]+)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Instala git-cliff
        if: ${{ env.RELEASE_PAT != '' }}
        run: |
          set -euo pipefail
          gh release download --repo orhun/git-cliff \
            --pattern 'git-cliff-*-x86_64-unknown-linux-gnu.tar.gz' \
            --output /tmp/git-cliff.tar.gz --clobber
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo install -m 0755 /tmp/git-cliff-*/git-cliff /usr/local/bin/git-cliff
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Bump calculado por git-cliff
        if: ${{ env.RELEASE_PAT != '' }}
        id: cliff
        run: |
          set -uo pipefail
          BUMPED="$(git-cliff --config cliff.toml --bumped-version 2>/dev/null | tr -d '[:space:]' || true)"
          echo "version=${BUMPED#v}" >> "$GITHUB_OUTPUT"
          echo "bump calculado: '${BUMPED#v}'"

      - name: Sincronizar versiones y PR de release (sin tag)
        if: ${{ env.RELEASE_PAT != '' && steps.cliff.outputs.version != '' && steps.cliff.outputs.version != steps.current.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          NEW="${{ steps.cliff.outputs.version }}"
          OLD="${{ steps.current.outputs.version }}"
          echo "bump: $OLD -> $NEW"
          sed -i "s/^version = \"$OLD\"/version = \"$NEW\"/" Cargo.toml
          # Mantener Cargo.lock alineado con Cargo.toml (H-01 / H-35).
          cargo update -p keybackcon
          sed -i "s/^__version__ = \".*\"/__version__ = \"$NEW\"/" gui/__init__.py
          sed -i "s/^pkgver=.*/pkgver=$NEW/" packaging/aur/PKGBUILD
          if [ -f npm/package.json ]; then
            sed -i "s/\"version\": \"$OLD\"/\"version\": \"$NEW\"/" npm/package.json || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock gui/__init__.py packaging/aur/PKGBUILD
          git add npm/package.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "sin cambios: el release ya está en camino"
            exit 0
          fi
          git commit -m "chore(release): prepara v$NEW"
          BRANCH="chore/release-v$NEW"
          # Idempotencia: un segundo push a main mientras el PR de release
          # sigue abierto reempujaba la rama y moría con non-fast-forward.
          # Si el PR ya existe, solo se refresca su rama (por si main avanzó)
          # y se deja que el auto-merge + tag-after-merge completen.
          if EXISTING="$(gh pr list --base main --head "$BRANCH" --state open --json number -q '.[0].number' 2>/dev/null)"; then
            echo "PR de release #$EXISTING ya existe para v$NEW; refrescando rama."
            gh pr update-branch "$EXISTING" --rebase 2>/dev/null || true
            exit 0
          fi
          git push origin "HEAD:$BRANCH"
          PR_URL="$(gh pr create --base main --head "$BRANCH" \
            --title "chore(release): v$NEW" \
            --body "Sincroniza versiones a v$NEW. Tras el merge, el job tag-after-merge crea el tag y dispara Release/NPM.")"
          PR_NUM="${PR_URL##*/}"
          # El push con RELEASE_PAT ya dispara CI en la rama y el pull_request;
          # el auto-merge (rebase) conserva el mensaje. Este job espera el
          # merge y etiqueta: si no llega, el tag no se crea.
          gh pr merge "$PR_NUM" --auto --rebase --delete-branch
          state=""
          for _ in $(seq 1 40); do
            state="$(gh pr view "$PR_NUM" --json state --jq .state)"
            [ "$state" = "MERGED" ] && break
            sleep 30
          done
          if [ "$state" != "MERGED" ]; then
            echo "PR $PR_NUM sin fusionar; no se etiqueta"
            exit 0
          fi
          git fetch origin main
          TIP="$(git rev-parse origin/main)"
          MSG="$(git log -1 --format=%s "$TIP")"
          if [ "$MSG" != "chore(release): prepara v$NEW" ]; then
            echo "main ($MSG) no es el commit de v$NEW"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$NEW" >/dev/null; then
            echo "el tag v$NEW ya existe"
            exit 0
          fi
          git tag "v$NEW" "$TIP"
          # El push del tag (con RELEASE_PAT) dispara Release y NPM por
          # `on: push: tags: v*`; no se redisparen a mano para no duplicar.
          git push origin "v$NEW"

  tag-after-merge:
    # Solo commits de preparación de release ya en main.
    # Comillas: el mensaje lleva ':' y espacio. Sin ellas el YAML no parsea
    # y Actions no arranca el workflow.
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): prepara v') }}"
    runs-on: ubuntu-latest
    env:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
    steps:
      - name: Sin RELEASE_PAT — no-op
        if: ${{ env.RELEASE_PAT == '' }}
        run: |
          echo "::notice::Falta el secret RELEASE_PAT. Crea un PAT (scopes repo y workflow) y guárdalo como secreto de repositorio RELEASE_PAT; sin él no se crea el tag ni se disparan Release/NPM. El job termina en verde."

      - uses: actions/checkout@v4
        if: ${{ env.RELEASE_PAT != '' }}
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
      - name: Crear tag sobre el commit fusionado y disparar publicación
        if: ${{ env.RELEASE_PAT != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          NEW="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*\"([^\"]+)\".*/\1/')"
          if git rev-parse "v$NEW" >/dev/null 2>&1; then
            echo "el tag v$NEW ya existe"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$NEW"
          # El push del tag (con RELEASE_PAT) dispara Release y NPM por
          # `on: push: tags: v*`.
          git push origin "v$NEW"
