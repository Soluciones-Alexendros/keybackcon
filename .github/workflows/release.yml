name: Release
on:
  push:
    tags:
      - "v*"
  # Versionado lo dispara con workflow_dispatch tras crear el tag (un push
  # con GITHUB_TOKEN no encadenaría workflows) y permite reintentos a mano.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: El tag debe coincidir con todas las fuentes de versión
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            local name="$1" file="$2" actual="$3"
            echo "$name: $actual (tag: $TAG)"
            [ "$actual" = "$TAG" ] || fail=1
          }
          check cargo   Cargo.toml              "$(grep -m1 '^version' Cargo.toml | sed -E 's/.*\"([^\"]+)\".*/\1/')"
          check gui     gui/__init__.py         "$(grep -m1 '^__version__' gui/__init__.py | sed -E 's/.*\"([^\"]+)\".*/\1/')"
          check pkbuild packaging/aur/PKGBUILD "$(grep -m1 '^pkgver=' packaging/aur/PKGBUILD | sed -E 's/pkgver=//')"
          [ "$fail" = 0 ] || { echo "El tag v$TAG no coincide con alguna fuente de versión"; exit 1; }
      - run: cargo test -- --test-threads=1
      - run: cargo build --release
      - run: bash scripts/smoke.sh
      - name: Instalar herramientas de empaquetado
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-cyclonedx --locked
      - name: Empaquetar
        run: |
          VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*\"([^\"]+)\".*/\1/')"
          DIST="keybackcon-v${VER}-linux-x86_64"
          mkdir -p "dist/${DIST}"
          cp target/release/keybackcon "dist/${DIST}/"
          mkdir -p "dist/${DIST}/gui"
          cp gui/*.py "dist/${DIST}/gui/"
          cp packaging/keybackcon-gui "dist/${DIST}/keybackcon-gui"
          chmod +x "dist/${DIST}/keybackcon-gui"
          cp -r packaging "dist/${DIST}/"
          cp README.md LICENSE CHANGELOG.md "dist/${DIST}/"
          (cd "dist/${DIST}" && sha256sum keybackcon keybackcon-gui > SHA256SUMS)
          tar -czf "dist/${DIST}.tar.gz" -C dist "${DIST}"
      - name: Generar .mo (i18n para el .deb)
        run: |
          command -v msgfmt >/dev/null 2>&1 || sudo apt-get install -y gettext
          for po in po/*.po; do
            lang=$(basename "$po" .po)
            mkdir -p "gui/locale/$lang/LC_MESSAGES"
            msgfmt -o "gui/locale/$lang/LC_MESSAGES/keybackcon.mo" "$po"
          done
          python3 scripts/check-i18n.py
      - name: Construir .deb (cargo-deb)
        run: cargo deb --no-build
      - name: Generar SBOM (CycloneDX)
        run: cargo cyclonedx --format json --override-filename sbom
      - name: Reunir artefactos y SHA256SUMS
        run: |
          cp target/debian/*.deb dist/
          cp sbom.json dist/
          (cd dist && sha256sum ./*.tar.gz ./*.deb sbom.json > SHA256SUMS)
          cat dist/SHA256SUMS
          ls -la dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/sbom.json
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/sbom.json
            dist/SHA256SUMS
