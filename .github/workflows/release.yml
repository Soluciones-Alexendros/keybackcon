name: Release
on:
  push:
    tags:
      - "v*"
  # Versionado lo dispara con workflow_dispatch tras crear el tag (un push
  # con GITHUB_TOKEN no encadenaría workflows) y permite reintentos a mano.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: El tag debe coincidir con todas las fuentes de versión
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            local name="$1" file="$2" actual="$3"
            echo "$name: $actual (tag: $TAG)"
            [ "$actual" = "$TAG" ] || fail=1
          }
          check cargo   Cargo.toml              "$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          check gui     gui/__init__.py         "$(grep -m1 '^__version__' gui/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')"
          check pkbuild packaging/aur/PKGBUILD "$(grep -m1 '^pkgver=' packaging/aur/PKGBUILD | sed -E 's/pkgver=//')"
          [ "$fail" = 0 ] || { echo "El tag v$TAG no coincide con alguna fuente de versión"; exit 1; }
      - name: Verificar paridad Cargo npm tag CHANGELOG
        run: bash scripts/check-version.sh
      - run: cargo test --locked -- --test-threads=1
      - run: cargo build --locked --release
      - name: Árbol sin cambios tras build --locked
        run: git diff --exit-code
      - name: GUI py_compile
        run: python3 -m py_compile gui/*.py
      - name: Suite Python (alineada con quality de CI)
        env:
          KEYBACKCON_REQUIRE_DBUS: "1"
          # Misma señal que quality (KBC-31): no deshacer al rebasear sobre #43.
          KEYBACKCON_REQUIRE_GUI_SUITE: "1"
          KEYBACKCON_GUI_TESTS: "1"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-gi \
            gir1.2-glib-2.0 \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            dbus \
            xvfb
          python3 -c "from gi.repository import Gio, GLib; print('GLib', GLib.MAJOR_VERSION, GLib.MINOR_VERSION)"
          python3 -c "import gi; gi.require_version('Gtk', '4.0'); gi.require_version('Adw', '1'); from gi.repository import Gtk, Adw; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version(), 'Adw OK')"
          GDK_BACKEND=x11 xvfb-run -a python3 -m unittest discover -s gui/tests -v
      - run: bash scripts/smoke.sh
      - name: Instalar herramientas de empaquetado
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-cyclonedx --locked
      - name: Empaquetar
        run: |
          VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          DIST="ilutex-v${VER}-linux-x86_64"
          mkdir -p "dist/${DIST}"
          cp target/release/ilutex "dist/${DIST}/"
          mkdir -p "dist/${DIST}/gui"
          cp gui/*.py "dist/${DIST}/gui/"
          cp packaging/ilutex-gui "dist/${DIST}/ilutex-gui"
          chmod +x "dist/${DIST}/ilutex-gui"
          cp -r packaging "dist/${DIST}/"
          cp README.md LICENSE CHANGELOG.md "dist/${DIST}/"
          (cd "dist/${DIST}" && sha256sum ilutex ilutex-gui > SHA256SUMS)
          tar -czf "dist/${DIST}.tar.gz" -C dist "${DIST}"
      - name: Generar .mo (i18n para el .deb)
        run: |
          command -v msgfmt >/dev/null 2>&1 || sudo apt-get install -y gettext
          for po in po/*.po; do
            lang=$(basename "$po" .po)
            mkdir -p "gui/locale/$lang/LC_MESSAGES"
            msgfmt -o "gui/locale/$lang/LC_MESSAGES/ilutex.mo" "$po"
          done
          python3 scripts/check-i18n.py
      - name: Construir .deb (cargo-deb)
        run: cargo deb --no-build
      - name: Generar SBOM (CycloneDX)
        run: cargo cyclonedx --format json --override-filename sbom
      - name: Reunir artefactos y SHA256SUMS
        run: |
          cp target/debian/*.deb dist/
          cp sbom.json dist/
          (cd dist && sha256sum ./*.tar.gz ./*.deb sbom.json > SHA256SUMS)
          cat dist/SHA256SUMS
          ls -la dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/sbom.json
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/sbom.json
            dist/SHA256SUMS